name: iOS Dylib Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build device and simulator dylibs
        run: bash Scripts/build_dylib.sh
      - name: Package dylibs
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist ios-dylibs.zip
      - name: Upload dylib package
        uses: actions/upload-artifact@v4
        with:
          name: FLEXReplicaCore-dylibs
          path: ios-dylibs.zip
          if-no-files-found: error
          retention-days: 30
